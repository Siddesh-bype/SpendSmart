<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Emerald-Cyan Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#06b6d4;#3b82f6;#10b981" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#3b82f6;#10b981;#06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#10b981;#06b6d4;#6366f1" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <!-- Pulse Animation -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes radarPing {
        0% { r: 4px; opacity: 0.9; }
        100% { r: 14px; opacity: 0; }
      }
      .pulsing-orb {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-badge {
        animation: floatSlow 4s ease-in-out infinite;
      }
      .ping-circle {
        animation: radarPing 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        transform-origin: 86px 86px;
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .text-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
      }
      .text-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="180" cy="100" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)" class="pulsing-orb" />
  <circle cx="1020" cy="200" r="160" fill="#06b6d4" opacity="0.1" filter="url(#glow)" class="pulsing-orb" style="animation-delay: -3s;" />

  <!-- Card Border -->
  <rect width="1198" height="318" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Top Decorative Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)" />

  <!-- App Icon / Emblem -->
  <g transform="translate(70, 75)">
    <!-- Icon Container -->
    <rect width="90" height="90" rx="22" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
    <rect width="90" height="90" rx="22" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.6" />
    
    <!-- Shield / Spark / Finance Graphic -->
    <path d="M 45 22 L 67 32 C 67 52 56 66 45 72 C 34 66 23 52 23 32 Z" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 45 35 L 45 57 M 35 44 L 55 44" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <circle cx="45" cy="45" r="14" fill="none" stroke="#6ee7b7" stroke-width="1.5" opacity="0.6" />
    
    <!-- Live Ping Dot -->
    <circle cx="75" cy="18" r="4" fill="#10b981" />
    <circle cx="75" cy="18" r="4" fill="none" stroke="#10b981" stroke-width="2" class="ping-circle" />
  </g>

  <!-- Title & Headline -->
  <g transform="translate(185, 115)">
    <text class="text-title" font-size="44" fill="#ffffff">
      SpendSmart<tspan fill="#10b981">.</tspan>
    </text>
    <text x="280" y="-8" class="text-mono" font-size="12" fill="#06b6d4" letter-spacing="1.5" font-weight="700">
      LOCAL-FIRST CORE
    </text>
    <text y="36" class="text-sub" font-size="17" fill="#94a3b8">
      High-Performance, Zero-Telemetry Android Personal Finance Engine
    </text>
  </g>

  <!-- Pill Feature Badges -->
  <g transform="translate(185, 195)">
    <!-- Badge 1: 100% Offline -->
    <g class="floating-badge" style="animation-delay: 0s;">
      <rect width="150" height="34" rx="17" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#10b981" />
      <text x="32" y="22" class="text-sub" font-size="12" font-weight="600" fill="#e2e8f0">100% Offline</text>
    </g>

    <!-- Badge 2: Zero Telemetry -->
    <g transform="translate(162, 0)" class="floating-badge" style="animation-delay: -1s;">
      <rect width="165" height="34" rx="17" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#06b6d4" />
      <text x="32" y="22" class="text-sub" font-size="12" font-weight="600" fill="#e2e8f0">Zero Telemetry</text>
    </g>

    <!-- Badge 3: Embedded Hive NoSQL -->
    <g transform="translate(339, 0)" class="floating-badge" style="animation-delay: -2s;">
      <rect width="180" height="34" rx="17" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#8b5cf6" />
      <text x="32" y="22" class="text-sub" font-size="12" font-weight="600" fill="#e2e8f0">Embedded Hive NoSQL</text>
    </g>

    <!-- Badge 4: Sub-ms Latency -->
    <g transform="translate(531, 0)" class="floating-badge" style="animation-delay: -1.5s;">
      <rect width="165" height="34" rx="17" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#f59e0b" />
      <text x="32" y="22" class="text-sub" font-size="12" font-weight="600" fill="#e2e8f0">Sub-ms Local I/O</text>
    </g>
  </g>

  <!-- Metrics / Specs on the Right -->
  <g transform="translate(930, 75)">
    <rect width="200" height="175" rx="14" fill="#0b1120" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2" />
    
    <text x="22" y="36" class="text-mono" font-size="11" fill="#64748b" font-weight="600">TEST RIGOR</text>
    <text x="22" y="62" class="text-title" font-size="22" fill="#10b981">98 / 98 PASS</text>
    <line x1="22" y1="76" x2="178" y2="76" stroke="#1e293b" stroke-width="1" />

    <text x="22" y="98" class="text-mono" font-size="11" fill="#64748b" font-weight="600">SANDBOX TARGET</text>
    <text x="22" y="122" class="text-title" font-size="19" fill="#f8fafc">Android API 36</text>
    <line x1="22" y1="134" x2="178" y2="134" stroke="#1e293b" stroke-width="1" />

    <text x="22" y="154" class="text-mono" font-size="11" fill="#06b6d4">SECURE LOCAL ONLY</text>
  </g>

  <!-- Bottom Accent Shimmer Line -->
  <line x1="70" y1="285" x2="1130" y2="285" stroke="#1e293b" stroke-width="1" />
  <circle cx="250" cy="285" r="3" fill="#10b981">
    <animate attributeName="cx" values="70;1130;70" dur="12s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;1;0.2" dur="12s" repeatCount="indefinite" />
  </circle>
</svg>

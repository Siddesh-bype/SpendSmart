<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes line1 { 0%, 10% { opacity: 0; } 15%, 100% { opacity: 1; } }
      @keyframes line2 { 0%, 25% { opacity: 0; } 30%, 100% { opacity: 1; } }
      @keyframes line3 { 0%, 45% { opacity: 0; } 50%, 100% { opacity: 1; } }
      @keyframes line4 { 0%, 65% { opacity: 0; } 70%, 100% { opacity: 1; } }
      @keyframes line5 { 0%, 82% { opacity: 0; } 87%, 100% { opacity: 1; } }
      @keyframes line6 { 0%, 92% { opacity: 0; } 96%, 100% { opacity: 1; } }

      .term-code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
        font-size: 13px;
        letter-spacing: -0.2px;
      }
      .cursor {
        animation: blink 1s infinite;
      }
      .t-line-1 { animation: line1 8s infinite; }
      .t-line-2 { animation: line2 8s infinite; }
      .t-line-3 { animation: line3 8s infinite; }
      .t-line-4 { animation: line4 8s infinite; }
      .t-line-5 { animation: line5 8s infinite; }
      .t-line-6 { animation: line6 8s infinite; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect width="800" height="360" rx="12" fill="url(#termBg)" stroke="#30363d" stroke-width="1.5" />

  <!-- Window Header -->
  <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 788 0 C 794.63 0 800 5.37 800 12 L 800 38 L 0 38 Z" fill="#21262d" />
  <line x1="0" y1="38" x2="800" y2="38" stroke="#30363d" stroke-width="1" />

  <!-- Mac Window Dots -->
  <circle cx="24" cy="19" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="44" cy="19" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="64" cy="19" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Window Title -->
  <text x="400" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8b949e" font-weight="600">
    flutter test — SpendSmart Test Suite
  </text>

  <!-- Terminal Body Content -->
  <g transform="translate(28, 70)" class="term-code">
    <!-- Prompt Command -->
    <text x="0" y="0">
      <tspan fill="#3fb950">❯ </tspan>
      <tspan fill="#58a6ff">flutter test</tspan>
      <tspan fill="#8b949e"> --reporter=expanded</tspan>
    </text>

    <!-- Line 1: Loading test runner -->
    <g class="t-line-1" transform="translate(0, 32)">
      <text x="0" y="0">
        <tspan fill="#8b949e">00:01 </tspan>
        <tspan fill="#79c0ff">[+0] </tspan>
        <tspan fill="#c9d1d9">loading test/spending_pulse_projection_test.dart...</tspan>
      </text>
    </g>

    <!-- Line 2: Spending Pulse Projection pass -->
    <g class="t-line-2" transform="translate(0, 64)">
      <text x="0" y="0">
        <tspan fill="#8b949e">00:02 </tspan>
        <tspan fill="#3fb950">[+14] </tspan>
        <tspan fill="#e6edf3">spending_pulse_projection_test: anchors projection across financial month</tspan>
      </text>
    </g>

    <!-- Line 3: Provider behavior and commit verification pass -->
    <g class="t-line-3" transform="translate(0, 96)">
      <text x="0" y="0">
        <tspan fill="#8b949e">00:04 </tspan>
        <tspan fill="#3fb950">[+38] </tspan>
        <tspan fill="#e6edf3">provider_behavior_test: confirms write landed before notifyListeners()</tspan>
      </text>
    </g>

    <!-- Line 4: Custom month offset pass -->
    <g class="t-line-4" transform="translate(0, 128)">
      <text x="0" y="0">
        <tspan fill="#8b949e">00:06 </tspan>
        <tspan fill="#3fb950">[+67] </tspan>
        <tspan fill="#e6edf3">financial_period_test: handles custom cycle start day (1st-28th) dynamically</tspan>
      </text>
    </g>

    <!-- Line 5: CSV & PDF ingestion pass -->
    <g class="t-line-5" transform="translate(0, 160)">
      <text x="0" y="0">
        <tspan fill="#8b949e">00:08 </tspan>
        <tspan fill="#3fb950">[+89] </tspan>
        <tspan fill="#e6edf3">screen_visibility_test: renders full suite with zero-latency navigation</tspan>
      </text>
    </g>

    <!-- Line 6: All Passed Summary -->
    <g class="t-line-6" transform="translate(0, 202)">
      <rect width="744" height="36" rx="6" fill="#238636" fill-opacity="0.15" stroke="#238636" stroke-width="1" />
      <text x="16" y="23">
        <tspan fill="#3fb950" font-weight="700">✓ 00:09 +98: All 98 tests passed!</tspan>
        <tspan fill="#8b949e"> (100% deterministic local suite)</tspan>
      </text>
    </g>

    <!-- Blinking Cursor Prompt Line -->
    <g transform="translate(0, 260)">
      <text x="0" y="0">
        <tspan fill="#3fb950">❯ </tspan>
        <tspan class="cursor" fill="#58a6ff">█</tspan>
      </text>
    </g>
  </g>
</svg>
